services:
  # File Translator API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-translator-api
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Omsk
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LLM_BASE_URL=http://172.16.25.142:41343/v1/chat/completions #/chat/completions 172.16.101.90:11434
      - LLM_MODEL_NAME=qwen3.6-35b-a3b-claude-4.6-opus-reasoning-distilled
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JOB_TTL_SECONDS=3600
      - GLOSSARY_DB_HOST=dbserver.onhp.local
      - GLOSSARY_DB_PORT=3306
      - GLOSSARY_DB_USER=glossary
      - GLOSSARY_DB_PASSWORD=yLA0@GKm1-Pg&Rmr
      - GLOSSARY_DB_NAME=glossary
      - GLOSSARY_COLLECTION_MAP=${GLOSSARY_COLLECTION_MAP}
      - LDAP_URL=${LDAP_URL:-ldap://172.16.101.35}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-CN=Корабельников М.В.,OU=DTD,OU=Units,DC=onhp,DC=local}
      - LDAP_BIND_CREDENTIALS=${LDAP_BIND_CREDENTIALS:-Frjulfytgthcbr&1}
      - LDAP_USER_SEARCH_BASE=${LDAP_USER_SEARCH_BASE:-OU=Units,DC=onhp,DC=local}
      - LDAP_SEARCH_FILTER=${LDAP_SEARCH_FILTER}
      - LDAP_GROUP_ADMIN=${LDAP_GROUP_ADMIN:-}
      - LDAP_GROUP_OPERATOR=${LDAP_GROUP_OPERATOR:-}
      - LDAP_GROUP_VIEWER=${LDAP_GROUP_VIEWER:-}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - ODA_CONVERTER_URL=http://oda-converter:5000
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./static:/app/static:ro
      - shared_data:/data
    dns_search:
      - onhp.local
    extra_hosts:
      - "dbserver:172.16.101.166"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    
  # Ollama Service for LLM inference
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: file-translator-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s
  #   restart: unless-stopped
    
  # Redis for job storage with automatic TTL
  redis:
    image: redis:7-alpine
    container_name: file-translator-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-R3d1s_S3cur3_2026!}
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-R3d1s_S3cur3_2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MongoDB for authentication data
  mongo:
    image: mongo:7
    container_name: file-translator-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend service (SPA + API proxy)
  frontend:
    image: nginx:alpine
    container_name: file-translator-frontend
    ports:
      - "3000:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ODA File Converter — DWG ↔ DXF (Phase 2)
  oda-converter:
    build:
      context: .
      dockerfile: oda-converter/Dockerfile
    container_name: file-translator-oda
    environment:
      - DISPLAY=:99
      - DATA_DIR=/data
    volumes:
      - shared_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  shared_data:
    driver: local
