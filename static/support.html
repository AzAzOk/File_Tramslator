<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поддержка — File Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=swap" rel="stylesheet">
<style>
  :root {
    --c-primary: #FDBB30;
    --c-primary-container: #FFD966;
    --c-on-primary-container: #272415;
    --c-surface: #F5F5F5;
    --c-surface-container: #E8E8E8;
    --c-surface-container-low: #EEEEEE;
    --c-surface-container-lowest: #FFFFFF;
    --c-on-surface: #272415;
    --c-on-surface-variant: #5C5C5C;
    --c-secondary: #6B6B6B;
    --c-outline-variant: #E8E8E8;
    --c-background: #F8F9FF;
    --c-status-success: #079455;
    --c-error: #BA1A1A;
  }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--c-background);
    color: var(--c-on-surface);
    margin: 0;
    padding: 0;
    line-height: 1.6;
  }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono-sm { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  header {
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-outline-variant);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header .inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--c-on-surface);
    margin: 0;
  }
  header a {
    color: var(--c-secondary);
    text-decoration: none;
    font-size: 14px;
    transition: color .15s;
  }
  header a:hover { color: var(--c-primary); }
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    margin: 0 0 8px;
    color: var(--c-on-surface);
  }
  .subtitle {
    color: var(--c-secondary);
    margin: 0 0 32px;
    font-size: 14px;
  }
  .card {
    background: var(--c-surface-container-lowest);
    border: 1px solid var(--c-outline-variant);
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 24px;
  }
  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3 .material-symbols-outlined { color: var(--c-primary); }
  textarea {
    width: 100%;
    background: var(--c-surface);
    border: 1px solid var(--c-outline-variant);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Geist', sans-serif;
    font-size: 14px;
    outline: none;
    resize: vertical;
    min-height: 120px;
    box-sizing: border-box;
    transition: border-color .15s;
    color: var(--c-on-surface);
  }
  textarea:focus { border-color: var(--c-primary); }
  textarea::placeholder { color: var(--c-secondary); }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    background: var(--c-primary-container);
    color: var(--c-on-primary-container);
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Geist', sans-serif;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: var(--c-error); font-size: 13px; margin-top: 8px; display: none; }
  .success { color: var(--c-status-success); font-size: 13px; margin-top: 8px; display: none; }
  .msg-item {
    padding: 16px;
    border-bottom: 1px solid var(--c-outline-variant);
  }
  .msg-item:last-child { border-bottom: none; }
  .msg-meta { font-size: 12px; color: var(--c-secondary); margin-bottom: 6px; }
  .msg-meta strong { color: var(--c-on-surface); }
  .msg-text { font-size: 14px; color: var(--c-on-surface-variant); line-height: 1.5; white-space: pre-wrap; }
  .empty {
    text-align: center;
    padding: 32px;
    color: var(--c-secondary);
    font-size: 14px;
  }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--c-secondary);
    font-size: 13px;
    border-top: 1px solid var(--c-outline-variant);
  }
  @media (max-width: 640px) {
    main { padding: 24px 16px 60px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1><a href="/" style="color:inherit;text-decoration:none;">File Translator</a></h1>
    <a href="/">← На главную</a>
  </div>
</header>

<main>
  <h2>Поддержка</h2>
  <p class="subtitle">Отправьте сообщение — предложение, замечание или жалобу. Сообщения видны только администраторам.</p>

  <div class="card">
    <h3><span class="material-symbols-outlined" aria-hidden="true">forum</span> Написать сообщение</h3>
    <div id="notAuth" class="empty">Для отправки сообщения необходимо <a href="/" style="color:var(--c-primary);">войти в систему</a>.</div>
    <form id="feedbackForm" style="display:none;">
      <textarea id="msgInput" placeholder="Опишите ваше предложение, замечание или жалобу..." maxlength="5000"></textarea>
      <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
        <button type="submit" class="btn"><span class="material-symbols-outlined" style="font-size:18px;">send</span> Отправить</button>
        <span id="charCount" class="font-mono-sm" style="font-size:12px;color:var(--c-secondary);">0 / 5000</span>
      </div>
      <p id="formError" class="error"></p>
      <p id="formSuccess" class="success"></p>
    </form>
  </div>

  <div class="card" id="adminPanel" style="display:none;">
    <h3><span class="material-symbols-outlined" aria-hidden="true">history</span> Все сообщения</h3>
    <div id="messagesList"></div>
  </div>
</main>

<footer>
  &copy; 2026 File Translator v2.0.0. ПАО ОНХП
</footer>

<script>
// ── Auth helpers ──
let authToken = localStorage.getItem('auth_token');
let refreshToken = localStorage.getItem('refresh_token');

function authFetch(url, options = {}) {
  const headers = options.headers || {};
  if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
  return fetch(url, { cache: 'no-store', ...options, headers });
}

async function tryRefresh() {
  const rt = localStorage.getItem('refresh_token');
  if (!rt) return false;
  try {
    const resp = await fetch('/api/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: rt }),
    });
    if (!resp.ok) return false;
    const data = await resp.json();
    authToken = data.access_token;
    refreshToken = data.refresh_token;
    localStorage.setItem('auth_token', authToken);
    localStorage.setItem('refresh_token', refreshToken);
    return true;
  } catch { return false; }
}

async function ensureAuth() {
  if (authToken) {
    const resp = await authFetch('/api/auth/me').catch(() => null);
    if (resp && resp.ok) return true;
    if (refreshToken && await tryRefresh()) {
      const retry = await authFetch('/api/auth/me').catch(() => null);
      if (retry && retry.ok) return true;
    }
  }
  return false;
}

// ── Form ──
const form = document.getElementById('feedbackForm');
const notAuth = document.getElementById('notAuth');
const msgInput = document.getElementById('msgInput');
const formError = document.getElementById('formError');
const formSuccess = document.getElementById('formSuccess');
const charCount = document.getElementById('charCount');
const adminPanel = document.getElementById('adminPanel');
const messagesList = document.getElementById('messagesList');

msgInput.addEventListener('input', () => {
  charCount.textContent = msgInput.value.length + ' / 5000';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.style.display = 'none';
  formSuccess.style.display = 'none';
  const msg = msgInput.value.trim();
  if (!msg) {
    formError.textContent = 'Напишите сообщение';
    formError.style.display = 'block';
    return;
  }
  try {
    const resp = await authFetch('/support/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg }),
    });
    if (resp.status === 201) {
      formSuccess.textContent = 'Сообщение отправлено. Спасибо!';
      formSuccess.style.display = 'block';
      msgInput.value = '';
      charCount.textContent = '0 / 5000';
      loadMessages();
    } else if (resp.status === 401) {
      if (await tryRefresh()) {
        const retry = await authFetch('/support/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        if (retry.ok) {
          formSuccess.textContent = 'Сообщение отправлено. Спасибо!';
          formSuccess.style.display = 'block';
          msgInput.value = '';
          charCount.textContent = '0 / 5000';
          loadMessages();
          return;
        }
      }
      notAuth.style.display = 'block';
      form.style.display = 'none';
    } else {
      const err = await resp.json().catch(() => ({}));
      formError.textContent = err.detail || 'Ошибка сервера';
      formError.style.display = 'block';
    }
  } catch {
    formError.textContent = 'Нет соединения с сервером';
    formError.style.display = 'block';
  }
});

// ── Messages list (admin) ──
async function loadMessages() {
  try {
    const resp = await authFetch('/support/feedback');
    if (resp.status === 403) return;
    if (!resp.ok) return;
    const msgs = await resp.json();
    adminPanel.style.display = 'block';
    if (msgs.length === 0) {
      messagesList.innerHTML = '<div class="empty">Пока нет сообщений</div>';
      return;
    }
    messagesList.innerHTML = msgs.map(m => {
      const date = new Date(m.created_at).toLocaleString('ru-RU');
      return `<div class="msg-item">
        <div class="msg-meta"><strong>${escapeHtml(m.username)}</strong> &middot; ${date}</div>
        <div class="msg-text">${escapeHtml(m.message)}</div>
      </div>`;
    }).join('');
  } catch {}
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

// ── Init ──
(async () => {
  const authed = await ensureAuth();
  if (authed) {
    notAuth.style.display = 'none';
    form.style.display = 'block';
  } else {
    notAuth.style.display = 'block';
    form.style.display = 'none';
  }
  loadMessages();
})();
</script>

</body>
</html>
