<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Translator — Администрирование</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121212'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='%23FDBB30' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts.css" />
  <!-- tokens.css defines the --c-* variables (light + dark) and is generated from
       the main application; it must load before any rule that references them. -->
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Theme — same semantics as the main application: `.dark` on <html>, choice
    // persisted in localStorage, system preference as the initial value. Kept in
    // <head> so the class is set before the first paint (no light-to-dark flash).
    (function () {
      var root = document.documentElement;
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      var prefersDark = window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved === 'dark' || (saved !== 'light' && prefersDark);
      root.classList.toggle('dark', dark);

      window.applyTheme = function (next) {
        root.classList.toggle('dark', next);
        try { localStorage.setItem('theme', next ? 'dark' : 'light'); } catch (e) { /* ignore */ }
        var btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.setAttribute(
            'aria-label',
            next ? 'Тема: тёмная. Переключить на светлую' : 'Тема: светлая. Переключить на тёмную'
          );
          btn.setAttribute('title', next ? 'Тема: тёмная' : 'Тема: светлая');
        }
      };
      window.applyTheme(dark);
    })();
  </script>
</head>
<body class="bg-background text-on-surface font-[Geist] min-h-screen">

  <!-- ============================ LOGIN ============================ -->
  <div id="login-view" class="hidden min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-sm rounded-2xl border border-outline-variant bg-surface-container-low p-8 shadow-2xl">
      <h1 class="font-[Space_Grotesk] text-2xl font-semibold text-on-surface">Панель администратора</h1>
      <p class="mt-1 text-sm text-on-surface-variant">File Translator · управление ролями и доступом</p>
      <form id="login-form" class="mt-6 space-y-4">
        <label class="block">
          <span class="mb-1 block text-xs uppercase tracking-wide text-on-surface-variant">Логин</span>
          <input id="login-username" type="text" autocomplete="username" required
                 class="input w-full px-3 py-2 text-sm" />
        </label>
        <label class="block">
          <span class="mb-1 block text-xs uppercase tracking-wide text-on-surface-variant">Пароль</span>
          <input id="login-password" type="password" autocomplete="current-password" required
                 class="input w-full px-3 py-2 text-sm" />
        </label>
        <p id="login-error" class="hidden text-sm text-error"></p>
        <button type="submit" class="btn btn-primary w-full py-2 text-sm">
          Войти
        </button>
      </form>
    </div>
  </div>

  <!-- ============================= APP ============================= -->
  <!-- `flex` is added by app.js on login (never via a media query: a responsive
       display rule would override `hidden` and show the shell next to the form) -->
  <div id="app-view" class="hidden min-h-screen">
    <aside class="w-60 shrink-0 border-r border-outline-variant bg-surface p-4">
      <div class="px-2 pb-6">
        <div class="font-[Space_Grotesk] text-lg font-semibold text-on-surface">File Translator</div>
        <div class="text-xs text-on-surface-variant">Администрирование</div>
      </div>
      <nav class="space-y-1" id="nav">
        <button data-page="dashboard" class="nav-item">Обзор</button>
        <button data-page="users" class="nav-item">Пользователи</button>
        <button data-page="roles" class="nav-item">Роли</button>
        <button data-page="access" class="nav-item">Доступ к коллекциям</button>
        <button data-page="settings" class="nav-item">Настройки</button>
      </nav>
      <div class="mt-8 rounded-lg border border-outline-variant bg-surface-container-low p-3 text-xs text-on-surface-variant">
        <div>Версия конфигурации</div>
        <div id="sidebar-version" class="font-[JetBrains_Mono] text-base text-on-surface-variant">—</div>
      </div>
    </aside>

    <div class="flex-1 overflow-y-auto">
      <header class="topbar">
        <h2 id="page-title" class="font-[Space_Grotesk] text-lg font-semibold text-on-surface">Обзор</h2>
        <div class="flex items-center gap-3 text-sm">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему" title="Тема">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        <a id="docs-btn" class="btn docs-open" href="/docs"
             title="Инструкция администратора" aria-label="Открыть инструкцию администратора">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <path d="M14 2v6h6" />
              <path d="M8 13h8M8 17h5" />
            </svg>
            Инструкция
          </a>

          <span class="text-on-surface-variant">Админ: <span id="current-admin" class="text-on-surface"></span></span>
          <button id="logout-btn" class="btn px-3 py-1.5 text-xs">
            Выйти
          </button>
        </div>
      </header>
      <main id="page-body" class="p-6"></main>
    </div>
  </div>

  <!-- ============================ MODAL ============================ -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="flex items-start justify-between">
        <h3 id="modal-title" class="font-[Space_Grotesk] text-lg font-semibold text-on-surface"></h3>
        <button id="modal-close" class="text-on-surface-variant hover:text-on-surface" type="button">✕</button>
      </div>
      <div id="modal-body" class="mt-4 max-h-[60vh] overflow-y-auto text-sm"></div>
      <div class="mt-6 flex justify-end gap-2">
        <button id="modal-cancel" class="btn px-4 py-2 text-xs" type="button">Отмена</button>
        <button id="modal-confirm" class="btn btn-primary px-4 py-2 text-xs" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
