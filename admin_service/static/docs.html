<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Инструкция администратора — File Translator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121212'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='bold' fill='%23FDBB30' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts.css" />
  <!-- tokens.css defines the --c-* variables (light + dark) and is generated from
       the main application; it must load before any rule that references them. -->
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    // Theme — same semantics as the main admin UI: `.dark` on <html>, choice
    // persisted in localStorage, system preference as the initial value. Kept in
    // <head> so the class is set before the first paint (no light-to-dark flash).
    (function () {
      var root = document.documentElement;
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      var prefersDark = window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved === 'dark' || (saved !== 'light' && prefersDark);
      root.classList.toggle('dark', dark);

      window.applyTheme = function (next) {
        root.classList.toggle('dark', next);
        try { localStorage.setItem('theme', next ? 'dark' : 'light'); } catch (e) { /* ignore */ }
        var btn = document.getElementById('docs-theme');
        if (btn) {
          btn.setAttribute(
            'aria-label',
            next ? 'Тема: тёмная. Переключить на светлую' : 'Тема: светлая. Переключить на тёмную'
          );
          btn.setAttribute('title', next ? 'Тема: тёмная' : 'Тема: светлая');
        }
      };
      window.applyTheme(dark);
    })();
  </script>
</head>
<body class="docs-body bg-background text-on-surface font-[Geist]">

  <!-- =============================== TOP BAR =============================== -->
  <header class="docs-bar">
    <a id="docs-back" class="btn" href="/" title="Вернуться в админку">← Админка</a>
    <h1 id="docs-title" class="docs-title">Инструкция администратора</h1>
    <div class="docs-search">
      <input id="docs-search" class="input docs-search-input" type="search"
             placeholder="Поиск по инструкции" aria-label="Поиск по инструкции" autocomplete="off" />
      <span id="docs-match-count" class="docs-match-count" aria-live="polite"></span>
      <button id="docs-prev" class="btn docs-icon-btn" type="button" disabled
              title="Предыдущее совпадение" aria-label="Предыдущее совпадение">↑</button>
      <button id="docs-next" class="btn docs-icon-btn" type="button" disabled
              title="Следующее совпадение" aria-label="Следующее совпадение">↓</button>
    </div>
    <button id="docs-theme" class="theme-toggle" type="button" aria-label="Переключить тему" title="Тема">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
  </header>

  <!-- ================================= BODY ================================= -->
  <div class="docs-body-grid">
    <aside class="docs-tree">
      <div class="docs-tree-head">
        Содержание <span id="docs-tree-count" class="docs-tree-count"></span>
      </div>
      <nav id="docs-tree" class="docs-tree-list"></nav>
    </aside>

    <main id="docs-article" class="docs-article">
      <p id="docs-status" class="docs-status">Загрузка инструкции…</p>
      <div id="docs-content" class="docs-content"></div>
    </main>
  </div>

  <script src="/docs.js"></script>
</body>
</html>
